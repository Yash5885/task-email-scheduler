name: Send task reminders

on:
  schedule:
    - cron: '30 18 * * *' # 12:00 AM IST, Prepare for study
    - cron: '0 19 * * *' # 12:30 AM IST, Setup
    - cron: '15 19 * * *' # 12:45 AM IST, Revise 2 old DSA questions
    - cron: '15 20 * * *' # 1:45 AM IST, New DSA Question 1
    - cron: '30 21 * * *' # 3:00 AM IST, Break
    - cron: '50 21 * * *' # 3:20 AM IST, New DSA Question 2
    - cron: '5 23 * * *' # 4:35 AM IST, Pattern notebook
    - cron: '35 23 * * *' # 5:05 AM IST, Challenge / GitHub rough work
    - cron: '15 0 * * *' # 5:45 AM IST, Walk + mental revision
    - cron: '0 1 * * *' # 6:30 AM IST, Breakfast
    - cron: '30 1 * * *' # 7:00 AM IST, Main sleep
    - cron: '45 7 * * *' # 1:15 PM IST, Wake/reset
    - cron: '15 8 * * *' # 1:45 PM IST, Lunch
    - cron: '15 9 * * *' # 2:45 PM IST, Placement subject
    - cron: '15 10 * * *' # 3:45 PM IST, Break
    - cron: '45 10 * * *' # 4:15 PM IST, DSA re-attempt block
    - cron: '45 11 * * *' # 5:15 PM IST, Flexible / rest
    - cron: '15 13 * * *' # 6:45 PM IST, Dinner / family
    - cron: '15 14 * * *' # 7:45 PM IST, LinkedIn / GitHub challenge post
    - cron: '15 15 * * *' # 8:45 PM IST, Rest / personal time
    - cron: '15 17 * * *' # 10:45 PM IST, Light concept revision
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send due reminders
        run: node scripts/send-due-reminders.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          REMINDER_LEAD_MINUTES: '15'
          REMINDER_UTC_OFFSET_MINUTES: '330'
